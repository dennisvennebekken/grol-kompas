<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16337e">
<meta name="robots" content="noindex, nofollow">
<title>Pagina niet gevonden — Grol Kompas</title>
<link rel="icon" href="/img/favicon.png" type="image/png">
<style>
@font-face{font-family:'Barlow Condensed';src:url('/fonts/barlow-condensed-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Inter';src:url('/fonts/inter-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Inter';src:url('/fonts/inter-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:24px;color:#0d1526;
  background:linear-gradient(150deg,#0d2461,#16337e 55%,#2a55b8)}
.kaart{width:100%;max-width:440px;background:#fff;border-radius:16px;padding:34px 30px 28px;
  text-align:center;box-shadow:0 4px 10px rgba(13,36,97,.10),0 16px 40px rgba(13,36,97,.25)}
img{width:72px;height:72px;object-fit:contain;margin-bottom:14px}
.streep{width:64px;height:5px;background:#c4122f;border-radius:3px;margin:0 auto 14px}
h1{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:2.1rem;line-height:1.05;
  text-transform:uppercase;letter-spacing:.01em;color:#16337e}
p{margin-top:12px;font-size:.95rem;line-height:1.55;color:#5a6478}
.knop{display:inline-flex;align-items:center;gap:8px;margin-top:22px;background:#16337e;color:#fff;
  text-decoration:none;border-radius:12px;padding:13px 22px;font-weight:700;font-size:.95rem;
  box-shadow:0 3px 12px rgba(22,51,126,.3);transition:background .18s}
.knop:hover{background:#2a55b8}
.sub{margin-top:18px;font-size:.8rem;color:#8a93a6}
.sub a{color:#16337e}
@media (prefers-color-scheme:dark){
  body{color:#e8edf8}
  .kaart{background:#111a2e}
  h1{color:#fff}
  p{color:#96a1bb}
  .sub{color:#7d879e}
  .sub a{color:#8fb0ff}
}
</style>
</head>
<body>
  <div class="kaart">
    <img src="/img/logo.png" alt="s.v. Grol logo">
    <div class="streep"></div>
    <h1>Deze pagina bestaat niet</h1>
    <p>Misschien klopt het adres niet, of is het onderdeel verplaatst. Ga terug naar de startpagina — vandaaruit vind je alles terug, of gebruik de zoekfunctie rechtsboven.</p>
    <a class="knop" href="/">Naar het Grol Kompas</a>
    <p class="sub">Klopt er iets niet? Laat het weten via <a href="mailto:dennis.vennebekken@svgrol.nl?subject=Grol%20Kompas%20%E2%80%94%20pagina%20niet%20gevonden">dennis.vennebekken@svgrol.nl</a></p>
  </div>
</body>
</html>
